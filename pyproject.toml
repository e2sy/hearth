[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-music"
version = "0.7.2"
description = "🔥 A cozy floating YouTube Music companion for every desktop — Arch Linux, Windows & macOS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mayank Bhaskar" }]
keywords = ["music", "player", "youtube-music", "pyqt6", "arch-linux", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PyQt6>=6.6.0,<7",
    "ytmusicapi>=1.7.0,<2",
    "yt-dlp>=2024.8.0",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10"]
discord = ["pypresence>=4"]

[project.scripts]
hearth = "hearth.app:main"

[project.urls]
Homepage = "https://github.com/qtjg/hearth"
Issues = "https://github.com/qtjg/hearth/issues"

[tool.setuptools.packages.find]
include = ["hearth*"]
