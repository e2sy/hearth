<svg xmlns="http://www.w3.org/2000/svg" width="800" height="20" viewBox="0 0 800 20" preserveAspectRatio="none" role="img" aria-label="hearth section divider">
  <line x1="0" y1="10" x2="800" y2="10" stroke="#30363d" stroke-width="1"/>
  <circle cx="400" cy="10" r="4" fill="#f78166">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
