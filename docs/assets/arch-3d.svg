<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="aTitle aDesc">
  <title id="aTitle">Hearth — isometric 3D system stack</title>
  <desc id="aDesc">Five floating isometric layers from yt-dlp and YT Music API up to the main window, with animated upward data flow.</desc>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="0.55" stop-color="#12101f"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <filter id="cGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="1176" height="816" rx="20" fill="url(#abg)" stroke="#232b3a"/>

  <text x="600" y="54" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#9aa4b2">HEARTH &#8212; ISOMETRIC SYSTEM STACK</text>

  <!-- faint isometric floor grid -->
  <g fill="none" stroke="#1a2230" stroke-width="1.2" opacity="0.7">
    <polygon points="600,540 1030,680 600,820 170,680"/>
    <polygon points="600,580 900,680 600,780 300,680"/>
  </g>

  <!-- static soft shadows under the base layer -->
  <ellipse cx="445" cy="788" rx="180" ry="12" fill="#05070b" opacity="0.75"/>
  <ellipse cx="755" cy="788" rx="180" ry="12" fill="#05070b" opacity="0.75"/>

  <!-- ================= LAYER 1 (bottom): SOURCES ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.5s" begin="-4.8s" repeatCount="indefinite"/>
    <polygon points="445,646 595,696 445,746 295,696" fill="#4ccc63" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="295,696 445,746 445,770 295,720" fill="#237a33"/>
    <polygon points="445,746 595,696 595,720 445,770" fill="#2f9c44"/>
    <text x="445" y="690" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1116">yt-dlp</text>
    <text x="445" y="712" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e1116" opacity="0.8">stream resolver</text>
    <polygon points="755,646 905,696 755,746 605,696" fill="#4ccc63" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="605,696 755,746 755,770 605,720" fill="#237a33"/>
    <polygon points="755,746 905,696 905,720 755,770" fill="#2f9c44"/>
    <text x="755" y="690" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1116">YT Music API</text>
    <text x="755" y="712" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e1116" opacity="0.8">search &#183; radio &#183; lyrics</text>
  </g>

  <!-- flow chevrons: Catalog -> Sources gap (blue) -->
  <g stroke="#5aa2ff" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#cGlow)">
    <g transform="translate(560,629)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0s" repeatCount="indefinite"/></path></g>
    <g transform="translate(600,629)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.35s" repeatCount="indefinite"/></path></g>
    <g transform="translate(640,629)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.7s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- ================= LAYER 2: CATALOG ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.5s" begin="-3.6s" repeatCount="indefinite"/>
    <polygon points="600,498 940,554 600,610 260,554" fill="#5aa2ff" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="260,554 600,610 600,634 260,578" fill="#1f6fd0"/>
    <polygon points="600,610 940,554 940,578 600,634" fill="#2f82ea"/>
    <text x="600" y="546" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e1116">CATALOG</text>
    <text x="600" y="572" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0e1116" opacity="0.8">guest API &#183; link parsing &#183; retry backoff &#183; loudness</text>
  </g>

  <!-- flow chevrons: Pools -> Catalog gap (teal) -->
  <g stroke="#43e0cd" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#cGlow)">
    <g transform="translate(560,487)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.2s" repeatCount="indefinite"/></path></g>
    <g transform="translate(600,487)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.55s" repeatCount="indefinite"/></path></g>
    <g transform="translate(640,487)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- ================= LAYER 3: WORKER POOLS ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.5s" begin="-2.4s" repeatCount="indefinite"/>
    <polygon points="600,356 940,412 600,468 260,412" fill="#43e0cd" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="260,412 600,468 600,492 260,436" fill="#17917f"/>
    <polygon points="600,468 940,412 940,436 600,492" fill="#25b8a4"/>
    <text x="600" y="404" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e1116">WORKER POOLS</text>
    <text x="600" y="430" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0e1116" opacity="0.8">LoadJob (audio) &#183; Search / Radio / Lyrics jobs (background)</text>
  </g>

  <!-- flow chevrons: Core -> Pools gap (purple) -->
  <g stroke="#b48bff" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#cGlow)">
    <g transform="translate(560,345)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/></path></g>
    <g transform="translate(600,345)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.75s" repeatCount="indefinite"/></path></g>
    <g transform="translate(640,345)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-1.1s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- ================= LAYER 4: PLAYBACK CORE ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.5s" begin="-1.2s" repeatCount="indefinite"/>
    <polygon points="600,214 940,270 600,326 260,270" fill="#b48bff" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="260,270 600,326 600,350 260,294" fill="#6f42c1"/>
    <polygon points="600,326 940,270 940,294 600,350" fill="#8a5ce0"/>
    <text x="600" y="262" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e1116">PLAYBACK CORE</text>
    <text x="600" y="288" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0e1116" opacity="0.8">PlaybackCore &#183; QueueEngine &#183; shuffle &#183; repeat &#183; autoplay refill</text>
  </g>

  <!-- flow chevrons: UI -> Core gap (orange) -->
  <g stroke="#ff9a3d" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#cGlow)">
    <g transform="translate(560,203)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.6s" repeatCount="indefinite"/></path></g>
    <g transform="translate(600,203)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.95s" repeatCount="indefinite"/></path></g>
    <g transform="translate(640,203)"><path d="M -9 5 L 0 -5 L 9 5"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-1.3s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- ================= LAYER 5 (top): MAIN WINDOW ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.5s" begin="0s" repeatCount="indefinite"/>
    <polygon points="600,72 940,128 600,184 260,128" fill="#ff9a3d" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <polygon points="260,128 600,184 600,208 260,152" fill="#b85f14"/>
    <polygon points="600,184 940,128 940,152 600,208" fill="#d97a1f"/>
    <text x="600" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0e1116">MAIN WINDOW &#183; UI</text>
    <text x="600" y="146" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0e1116" opacity="0.8">home &#183; search &#183; library &#183; now playing &#183; player bar &#183; queue</text>
  </g>

  <!-- ================= side data cubes ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" begin="-2s" repeatCount="indefinite"/>
    <polygon points="150,393 184,410 150,427 116,410" fill="#4ccc63" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="116,410 150,427 150,449 116,432" fill="#237a33"/>
    <polygon points="150,427 184,410 184,432 150,449" fill="#2f9c44"/>
    <text x="150" y="474" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9aa4b2">SQLite</text>
    <text x="150" y="492" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681">favorites &#183; history</text>
    <text x="150" y="508" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681">playlists</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" begin="-4.4s" repeatCount="indefinite"/>
    <polygon points="1050,283 1084,300 1050,317 1016,300" fill="#b6c2cf" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="1016,300 1050,317 1050,339 1016,322" fill="#6e7681"/>
    <polygon points="1050,317 1084,300 1084,322 1050,339" fill="#8b949e"/>
    <text x="1050" y="364" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9aa4b2">QSettings</text>
    <text x="1050" y="382" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681">theme &#183; volume</text>
    <text x="1050" y="398" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681">hotkeys &#183; autoplay</text>
  </g>

  <!-- decorative floating cubes -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="0.6">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.8s" begin="-1s" repeatCount="indefinite"/>
      <polygon points="135,193 159,205 135,217 111,205" fill="#b48bff"/>
      <polygon points="111,205 135,217 135,232 111,220" fill="#6f42c1"/>
      <polygon points="135,217 159,205 159,220 135,232" fill="#8a5ce0"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5.4s" begin="-3s" repeatCount="indefinite"/>
      <polygon points="1085,573 1109,585 1085,597 1061,585" fill="#43e0cd"/>
      <polygon points="1061,585 1085,597 1085,612 1061,600" fill="#17917f"/>
      <polygon points="1085,597 1109,585 1109,600 1085,612" fill="#25b8a4"/>
    </g>
  </g>

  <text x="600" y="806" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6e7681">audio + metadata flow upward &#8212; every hop runs on its own thread pool</text>
</svg>
