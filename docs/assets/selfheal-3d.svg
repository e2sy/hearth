<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="sTitle sDesc">
  <title id="sTitle">Hearth — self-healing playback, in 3D</title>
  <desc id="sDesc">Isometric diagram: a stream platform feeds the playback core through a pulsing 403 glitch, a proof-of-audio gate watches, and three floating outcome tiles show the endings — rejoin with a fresh URL, skip once per proven track, or halt with an honest stop.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="0.55" stop-color="#16101c"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a18" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </linearGradient>
    <filter id="sGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="1176" height="816" rx="20" fill="url(#sbg)" stroke="#232b3a"/>

  <text x="600" y="54" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="5" fill="#9aa4b2">HEARTH &#8212; SELF-HEALING PLAYBACK</text>

  <!-- faint isometric floor grid -->
  <g fill="none" stroke="#1a2230" stroke-width="1.2" opacity="0.7">
    <polygon points="600,560 1010,700 600,830 190,700"/>
    <polygon points="600,600 880,700 600,790 320,700"/>
  </g>

  <!-- ================= FLOW PATHS (under everything) ================= -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M 320 280 C 420 300, 490 320, 540 340" stroke="#ff7a18" opacity="0.45" stroke-dasharray="1 10"/>
    <path d="M 700 320 C 790 260, 830 230, 866 212" stroke="#4ccc63" opacity="0.5" stroke-dasharray="1 10"/>
    <path d="M 706 390 C 790 392, 820 388, 856 384" stroke="#ff7a18" opacity="0.5" stroke-dasharray="1 10"/>
    <path d="M 700 410 C 800 470, 840 510, 872 548" stroke="#ff2d55" opacity="0.45" stroke-dasharray="1 10"/>
    <path d="M 370 560 C 460 505, 520 450, 566 408" stroke="#7b2ff7" opacity="0.5" stroke-dasharray="1 10"/>
  </g>

  <!-- ================= STREAM SOURCE (top left) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5.2s" repeatCount="indefinite"/>
    <ellipse cx="240" cy="322" rx="120" ry="11" fill="#05070b" opacity="0.75"/>
    <polygon points="240,196 350,240 240,284 130,240" fill="#ff9d4d" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="130,240 240,284 240,312 130,268" fill="#b35611"/>
    <polygon points="350,240 240,284 240,312 350,268" fill="#e07715"/>
    <text x="240" y="236" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14100c">&#9654; STREAM</text>
    <text x="240" y="258" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14100c" opacity="0.85">yt-dlp &#183; fresh URL</text>
  </g>

  <!-- the 403 glitch, pulsing between stream and core -->
  <g filter="url(#sGlow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" repeatCount="indefinite"/>
    <polygon points="455,282 505,302 455,322 405,302" fill="#e04a3a" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="455" y="308" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">403</text>
    <g stroke="#ff6b5a" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
      <line x1="445" y1="264" x2="451" y2="252"/>
      <line x1="467" y1="266" x2="476" y2="256"/>
      <line x1="429" y1="270" x2="418" y2="262"/>
    </g>
  </g>

  <!-- ================= PLAYBACK CORE + WATCHDOG (center) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" begin="-2s" repeatCount="indefinite"/>
    <ellipse cx="620" cy="446" rx="165" ry="13" fill="#05070b" opacity="0.8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 620 356;360 620 356" dur="9s" repeatCount="indefinite"/>
      <ellipse cx="620" cy="356" rx="180" ry="82" fill="none" stroke="#7b2ff7" stroke-width="1.6" stroke-dasharray="10 14" opacity="0.55"/>
    </g>
    <polygon points="620,282 760,356 620,430 480,356" fill="#a06de8" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <polygon points="480,356 620,430 620,462 480,388" fill="#5c2fa8"/>
    <polygon points="760,356 620,430 620,462 760,388" fill="#7b3fd0"/>
    <text x="620" y="348" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#150d24">PLAYBACK CORE</text>
    <text x="620" y="372" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#150d24" opacity="0.85">queue engine &#183; watchdog</text>
  </g>

  <!-- proof-of-audio gate (bottom left) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4.6s" begin="-1.1s" repeatCount="indefinite"/>
    <ellipse cx="300" cy="654" rx="118" ry="11" fill="#05070b" opacity="0.75"/>
    <polygon points="300,534 408,576 300,618 192,576" fill="#c9a1ff" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="192,576 300,618 300,646 192,604" fill="#6a35c2"/>
    <polygon points="408,576 300,618 300,646 408,604" fill="#8b4ee0"/>
    <text x="300" y="572" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a0f2e">PROOF-OF-AUDIO GATE</text>
    <text x="300" y="592" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a0f2e" opacity="0.85">only real sound may rejoin</text>
  </g>

  <!-- ================= OUTCOME TILES (right column) ================= -->
  <!-- rejoin -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5.4s" begin="-0.7s" repeatCount="indefinite"/>
    <ellipse cx="965" cy="266" rx="122" ry="11" fill="#05070b" opacity="0.75"/>
    <polygon points="965,140 1078,184 965,228 852,184" fill="#6fe385" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="852,184 965,228 965,258 852,214" fill="#1f7a2f"/>
    <polygon points="1078,184 965,228 965,258 1078,214" fill="#2f9c44"/>
    <text x="965" y="178" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0e1116">&#8634; REJOIN</text>
    <text x="965" y="200" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0e1116" opacity="0.85">fresh URL &#183; same song</text>
    <text x="965" y="216" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0e1116" opacity="0.7">budget: 3 &#183; renewed by 30s healthy</text>
  </g>

  <!-- skip -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5.8s" begin="-2.4s" repeatCount="indefinite"/>
    <ellipse cx="965" cy="456" rx="122" ry="11" fill="#05070b" opacity="0.75"/>
    <polygon points="965,330 1078,374 965,418 852,374" fill="#ffb36b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="852,374 965,418 965,448 852,404" fill="#b35611"/>
    <polygon points="1078,374 965,418 965,448 1078,404" fill="#e07715"/>
    <text x="965" y="368" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#14100c">&#8677; SKIP</text>
    <text x="965" y="390" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#14100c" opacity="0.85">once per proven track</text>
    <text x="965" y="406" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#14100c" opacity="0.7">a dead URL is never re-fed</text>
  </g>

  <!-- halt -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6.2s" begin="-3.6s" repeatCount="indefinite"/>
    <ellipse cx="965" cy="646" rx="122" ry="11" fill="#05070b" opacity="0.75"/>
    <polygon points="965,520 1078,564 965,608 852,564" fill="#ff8d7e" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <polygon points="852,564 965,608 965,638 852,594" fill="#8e2418"/>
    <polygon points="1078,564 965,608 965,638 1078,594" fill="#c2402f"/>
    <text x="965" y="558" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#2a0703">&#9632; HALT</text>
    <text x="965" y="580" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2a0703" opacity="0.85">honest stop &#183; no zombies</text>
    <text x="965" y="596" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2a0703" opacity="0.7">three dead tracks in a row</text>
  </g>

  <!-- ================= TRAVELLING PULSES ================= -->
  <!-- music notes stream -> core -->
  <g fill="#ffcf9e" font-size="17" filter="url(#sGlow)">
    <text x="0" y="0" opacity="0.95">&#9834;<animateMotion path="M 320 280 C 420 300, 490 320, 540 340" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="0" y="0" opacity="0.95">&#9835;<animateMotion path="M 320 280 C 420 300, 490 320, 540 340" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/></text>
  </g>
  <!-- red error spark crossing the glitch -->
  <circle r="3.5" fill="#ff6b5a" filter="url(#sGlow)">
    <animateMotion path="M 320 280 C 420 300, 490 320, 540 340" dur="4.4s" begin="-2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.2;0.75;1" dur="4.4s" begin="-2.2s" repeatCount="indefinite"/>
  </circle>
  <!-- green rejoin loop: core -> rejoin, then back -->
  <circle r="4" fill="#8fe89f" filter="url(#sGlow)">
    <animateMotion path="M 700 320 C 790 260, 830 230, 866 212" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#6fe385" filter="url(#sGlow)">
    <animateMotion path="M 866 212 C 820 260, 760 300, 716 332" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
  </circle>
  <!-- orange skip -->
  <circle r="4" fill="#ffcf9e" filter="url(#sGlow)">
    <animateMotion path="M 706 390 C 790 392, 820 388, 856 384" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- red halt (rare) -->
  <circle r="4" fill="#ff8d7e" filter="url(#sGlow)">
    <animateMotion path="M 700 410 C 800 470, 840 510, 872 548" dur="7.2s" begin="-3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" dur="7.2s" begin="-3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- purple proof pulse: gate -> core -->
  <circle r="3.5" fill="#c9a1ff" filter="url(#sGlow)">
    <animateMotion path="M 370 560 C 460 505, 520 450, 566 408" dur="3.2s" begin="-0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.2s" begin="-0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- caption -->
  <text x="600" y="800" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" letter-spacing="2" fill="#9aa4b2">a dead URL is skipped once &#8212; never re-fed &#183; three strikes and the fire rests</text>
</svg>
