<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="hTitle hDesc">
  <title id="hTitle">Hearth — 3D animated hero</title>
  <desc id="hDesc">Isometric 3D banner with a glowing play puck, a live equalizer and floating notes.</desc>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1017">
        <animate attributeName="stop-color" values="#0d1017;#160f22;#0d1017" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#101623"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff7a18" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb46b"/>
      <stop offset="0.5" stop-color="#ff7a18">
        <animate attributeName="stop-color" values="#ff7a18;#ff2d55;#7b2ff7;#ff7a18" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb46b"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <radialGradient id="puckGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffa64d"/>
      <stop offset="0.55" stop-color="#f0641a"/>
      <stop offset="1" stop-color="#c43c07"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="1176" height="406" rx="20" fill="url(#hbg)" stroke="#232b3a"/>

  <!-- ambient ember glow behind the puck, breathing -->
  <ellipse cx="270" cy="300" rx="320" ry="190" fill="url(#emberGlow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- light sweep -->
  <g>
    <rect x="-320" y="12" width="280" height="406" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1520 0" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title with glow -->
  <text x="600" y="122" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="14" fill="#ff7a18" opacity="0.5" filter="url(#softGlow)">HEARTH</text>
  <text x="600" y="122" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="14" fill="url(#titleGrad)">HEARTH</text>
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#b8c2cf" letter-spacing="1">a cozy three-pane desktop player for YouTube Music</text>

  <!-- chips -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa4b2" text-anchor="middle">
    <rect x="306" y="194" width="140" height="34" rx="17" fill="#141a26" stroke="#2b3442"/>
    <text x="376" y="216">no account</text>
    <rect x="462" y="194" width="120" height="34" rx="17" fill="#141a26" stroke="#2b3442"/>
    <text x="522" y="216">no keys</text>
    <rect x="598" y="194" width="130" height="34" rx="17" fill="#141a26" stroke="#2b3442"/>
    <text x="663" y="216">seven themes</text>
    <rect x="744" y="194" width="150" height="34" rx="17" fill="#141a26" stroke="#2b3442"/>
    <text x="819" y="216">endless radio</text>
  </g>

  <!-- 3D play puck with pulse rings -->
  <g>
    <circle cx="270" cy="332" r="58" fill="none" stroke="#ff7a18" stroke-width="2">
      <animate attributeName="r" values="58;92" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="332" r="58" fill="none" stroke="#ff2d55" stroke-width="2">
      <animate attributeName="r" values="58;92" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="341" r="58" fill="#6e2403"/>
    <circle cx="270" cy="332" r="58" fill="url(#puckGrad)" stroke="#ffb46b" stroke-width="1.5"/>
    <polygon points="256,306 256,362 306,334" fill="#5a1d02" opacity="0.55"/>
    <polygon points="256,302 256,358 306,330" fill="#fff3e6"/>
    <polygon points="256,302 256,358 306,330" fill="#ffffff" opacity="0.12">
      <animate attributeName="opacity" values="0.12;0.3;0.12" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- equalizer -->
  <line x1="470" y1="373" x2="730" y2="373" stroke="#2b3442" stroke-width="2"/>
  <g fill="url(#eqGrad)">
    <rect x="482" width="18" rx="4" y="350" height="22">
      <animate attributeName="height" values="22;86;40;104;22" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="350;286;332;268;350" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="518" width="18" rx="4" y="312" height="60">
      <animate attributeName="height" values="60;30;96;48;60" dur="1.4s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="312;342;276;324;312" dur="1.4s" begin="-0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="554" width="18" rx="4" y="272" height="100">
      <animate attributeName="height" values="100;44;74;18;100" dur="1.9s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="272;328;298;354;272" dur="1.9s" begin="-0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="590" width="18" rx="4" y="338" height="34">
      <animate attributeName="height" values="34;90;56;108;34" dur="1.5s" begin="-0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="338;282;316;264;338" dur="1.5s" begin="-0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="626" width="18" rx="4" y="294" height="78">
      <animate attributeName="height" values="78;26;96;50;78" dur="2.1s" begin="-1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="294;346;276;322;294" dur="2.1s" begin="-1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="662" width="18" rx="4" y="328" height="44">
      <animate attributeName="height" values="44;102;32;84;44" dur="1.6s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="328;270;340;288;328" dur="1.6s" begin="-0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="698" width="18" rx="4" y="280" height="92">
      <animate attributeName="height" values="92;38;70;24;92" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="280;334;302;348;280" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating notes -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="url(#noteGrad)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="5s" repeatCount="indefinite"/>
        <text x="856" y="310" font-size="42">&#9834;</text>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.6s" begin="-1.4s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="4;-4;4" dur="4.2s" repeatCount="indefinite"/>
        <text x="952" y="348" font-size="30" opacity="0.85">&#9835;</text>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="5.2s" begin="-2.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="5.6s" begin="-1s" repeatCount="indefinite"/>
        <text x="1036" y="300" font-size="50" opacity="0.95">&#9834;</text>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.8s" begin="-0.8s" repeatCount="indefinite"/>
      <text x="1104" y="342" font-size="26" opacity="0.7">&#9835;</text>
    </g>
  </g>

  <!-- tiny floating cubes -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="0.6">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      <polygon points="110,382 132,393 110,404 88,393" fill="#ff9a3d"/>
      <polygon points="88,393 110,404 110,418 88,407" fill="#b85f14"/>
      <polygon points="110,404 132,393 132,407 110,418" fill="#d97a1f"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.4s" begin="-1.6s" repeatCount="indefinite"/>
      <polygon points="1078,84 1100,95 1078,106 1056,95" fill="#43e0cd"/>
      <polygon points="1056,95 1078,106 1078,120 1056,109" fill="#17917f"/>
      <polygon points="1078,106 1100,95 1100,109 1078,120" fill="#25b8a4"/>
    </g>
  </g>
</svg>
