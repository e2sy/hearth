name: Build desktop binaries

# Produces a real Windows .exe on GitHub's free Windows runner and a
# Linux ELF on the Linux runner whenever a tag matching v*.*.* is
# pushed. Both artifacts are smoke-tested on their native platforms
# before being uploaded — the build only succeeds if the binary
# actually boots and runs the Qt event loop for 6 seconds. A release
# is then published with the binaries attached.
#
# Why no .apk step: PyQt6 has no Android backend (Qt for Android is
# a separate native toolkit and isn't exposed by the Python bindings).
# A real .apk would require rewriting the UI in Kivy, BeeWare, or a
# native framework — that's a multi-week project, not a build step.
# See ROADMAP-ANDROID.md for the long-form plan.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to publish as (without leading v)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Qt deps
        run: |
          sudo apt-get update -qq
          # The libxcb-util package was renamed across Ubuntu releases;
          # install the canonical set used by Qt6's xcb QPA plugin and
          # let apt skip ones that don't exist on the runner's distro
          # without failing the build.
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxcb-util1 \
            libfontconfig1 libfreetype6 \
            libdbus-1-3 || \
            sudo apt-get install -y -q --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxcb-util0 \
            libfontconfig1 libfreetype6 \
            libdbus-1-3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Build with PyInstaller
        run: pyinstaller hearth.spec --noconfirm

      - name: Smoke-test the binary (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          ./dist/hearth --no-single-instance &
          PID=$!
          sleep 6
          if kill -0 $PID 2>/dev/null; then
            echo "[smoke] PASS — binary still running after 6s"
            kill -TERM $PID
            wait $PID || true
          else
            wait $PID
            echo "[smoke] FAIL — binary exited early with code $?"
            exit 1
          fi

      - name: Compress binary
        run: |
          cd dist
          tar -czf hearth-linux-x64.tar.gz hearth
          sha256sum hearth-linux-x64.tar.gz > hearth-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-linux-x64
          path: |
            dist/hearth-linux-x64.tar.gz
            dist/hearth-linux-x64.tar.gz.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build with PyInstaller
        run: pyinstaller hearth.spec --noconfirm

      - name: Smoke-test the .exe (offscreen)
        # On Windows the offscreen Qt platform plugin is bundled, so
        # we can boot the GUI without a real display. The binary is
        # launched in the background, given 6 seconds to settle, then
        # killed; the build only succeeds if it was still running.
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\hearth.exe" `
                             -ArgumentList "--no-single-instance" `
                             -PassThru -NoNewWindow `
                             -RedirectStandardOutput "out.txt" `
                             -RedirectStandardError "err.txt"
          Start-Sleep -Seconds 6
          if (-not $p.HasExited) {
            Write-Host "[smoke] PASS - .exe still running after 6s"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "[smoke] FAIL - .exe exited early with code $($p.ExitCode)"
            Write-Host "stdout:"
            Get-Content out.txt -ErrorAction SilentlyContinue
            Write-Host "stderr:"
            Get-Content err.txt -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Zip the .exe
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\hearth.exe -DestinationPath .\hearth-win-x64.zip
          $hash = (Get-FileHash .\hearth-win-x64.zip -Algorithm SHA256).Hash
          "$hash  hearth-win-x64.zip" | Out-File -Encoding ascii .\hearth-win-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-win-x64
          path: |
            hearth-win-x64.zip
            hearth-win-x64.zip.sha256

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hearth-linux-x64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: hearth-win-x64
          path: release

      - name: Display downloaded artifacts
        run: ls -la release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/hearth-linux-x64.tar.gz
            release/hearth-linux-x64.tar.gz.sha256
            release/hearth-win-x64.zip
            release/hearth-win-x64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
